<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>業務部マニュアル | 株式会社カスケディア・トレーディング</title>
<meta name="description" content="業務部 業務マニュアル - プロセスフロー・操作手順・チェックリスト">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">C</div>
      <div class="logo-text">
        <span class="logo-title">業務部マニュアル</span>
        <span class="logo-sub">株式会社カスケディア・トレーディング</span>
      </div>
    </div>
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="メニュー切替">☰</button>
  </div>

  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="マニュアルを検索…" autocomplete="off">
  </div>

  <nav class="nav-tree" id="navTree">
    <div class="nav-section">
      <div class="nav-section-title" data-section="intro">
        <svg class="chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        はじめに
      </div>
      <div class="nav-section-items">
        <a class="nav-item active" data-page="home" href="#">
          <span class="nav-dot"></span>マニュアルの使い方
        </a>
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-section-title open" data-section="domestic">
        <svg class="chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        国内取引
      </div>
      <div class="nav-section-items show">
        <a class="nav-item" data-page="dom-buy" href="#">
          <span class="nav-dot"></span>買継取引（国内）
        </a>
        <a class="nav-item" data-page="dom-stock" href="#">
          <span class="nav-dot"></span>在庫取引（国内）
        </a>
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-section-title" data-section="import">
        <svg class="chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        輸入取引
      </div>
      <div class="nav-section-items">
        <a class="nav-item" data-page="imp-buy" href="#">
          <span class="nav-dot"></span>買継取引（輸入+前払）
        </a>
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-section-title" data-section="misc">
        <svg class="chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        諸掛・倉庫管理
      </div>
      <div class="nav-section-items">
        <a class="nav-item" data-page="expense" href="#">
          <span class="nav-dot"></span>諸掛処理
        </a>
        <a class="nav-item" data-page="warehouse" href="#">
          <span class="nav-dot"></span>倉庫移動
        </a>
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-section-title" data-section="returns">
        <svg class="chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        返品処理
      </div>
      <div class="nav-section-items">
        <a class="nav-item" data-page="returns" href="#">
          <span class="nav-dot"></span>返品処理（3パターン）
        </a>
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-section-title" data-section="billing">
        <svg class="chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        請求・回収
      </div>
      <div class="nav-section-items">
        <a class="nav-item" data-page="billing" href="#">
          <span class="nav-dot"></span>請求〜回収
        </a>
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-section-title" data-section="payment">
        <svg class="chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        支払・出金
      </div>
      <div class="nav-section-items">
        <a class="nav-item" data-page="pay-dom" href="#">
          <span class="nav-dot"></span>支払〜出金（国内）
        </a>
        <a class="nav-item" data-page="pay-intl" href="#">
          <span class="nav-dot"></span>支払〜出金（海外）
        </a>
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-section-title" data-section="accounting">
        <svg class="chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        会計連携
      </div>
      <div class="nav-section-items">
        <a class="nav-item" data-page="accounting" href="#">
          <span class="nav-dot"></span>会計連携
        </a>
      </div>

  <div class="sidebar-footer">
    <div class="version-badge">v1.0 ドラフト</div>
    <div class="last-updated">最終更新: 2026-04-24</div>
  </div>

<!-- Main Content -->
<main class="main" id="mainContent">
  <header class="topbar">
    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="メニュー">☰</button>
    <div class="breadcrumb" id="breadcrumb">
      <span>業務部マニュアル</span>
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span id="breadcrumbPage">はじめに</span>
    </div>
    <div class="topbar-actions">
      <span class="status-badge status-draft">有識者確認待ち</span>
    </div>
  </header>

  <div class="content-area" id="contentArea">
    <!-- Pages are rendered by JS -->
  </div>
</main>

<script src="pages-data.js"></script>
<script src="pages-data2.js"></script>
<script src="pages-data3.js"></script>
<script src="app.js"></script>
</body>
</html>
